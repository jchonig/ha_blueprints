blueprint:
  name: Voice Timer
  description: |-
    Start a Home Assistant `timer` helper by voice, with a spoken
    confirmation of the duration — or from anywhere else (a dashboard
    or Tessera screen tile, the HA UI), alerting on a default device.

    Optionally shows a live countdown on your phone (Notify actions
    only — see Show live countdown below).

    When it finishes, on the same Assist satellite / media player that
    heard the start command:
    - Loops a sound file, spoken TTS, or both
    - Pushes a phone notification with a Stop button

    Silence it by:
    - Saying a stop phrase (optionally naming the timer, so concurrent
      timers don't stop each other)
    - Tapping the notification button (heard even mid-sound)
    - Pressing the physical button on the originating satellite
    - Tapping Stop on a screen's tile (the Tessera Timers plugin's
      "Timers done" or "Timer done" sensor)
    - Saying a stop phrase before it finishes cancels it outright

    Silencing it any other way also presses the screen's "Silence
    timers" button, if given, so the screen stops sounding too.

    Restarting the timer while the alert is going (e.g. the Tessera
    Timers plugin's +1m) silences it and alerts again when the new
    countdown finishes.

    🚀 Version 2026.11.14.3

    Setup:
    - Only the `timer` helper itself needs to be created by hand
    - Default duration comes from the timer helper's own configured
      duration
    - Everything else (which device to reply to, the alert loop) is
      tracked inside this automation's own runs instead of extra
      helpers, so multiple timers can run at once without interfering
    - Trade-off: a Home Assistant restart mid-countdown or mid-alert
      loses that in-progress run
  domain: automation
  input:
    timer_entity:
      name: Timer helper
      description: The `timer` helper this blueprint starts and watches.
      selector:
        entity:
          domain: timer

    default_satellite:
      name: Default Assist satellite
      description: >-
        Optional. Where the alert sound/TTS goes when the timer wasn't
        started by voice from a satellite — e.g. started from a
        dashboard or Tessera screen tile, or typed into the Assist chat
        window. Takes priority over the fallback media player below.
      default: ""
      selector:
        entity:
          domain: assist_satellite

    fallback_media_player:
      name: Fallback media player
      description: >-
        Optional. Used only if the start command didn't come from a
        satellite device with its own media_player and no default
        Assist satellite is set. Plays the sound file only (no TTS, no
        ducking). If left blank and no device is found, the alert
        sound/TTS is skipped (the phone notification, if configured,
        still fires).
      default: ""
      selector:
        entity:
          domain: media_player

    alarm_mode:
      name: Alert type
      description: >-
        Sound file, spoken text-to-speech, or both, on repeat until
        stopped. Text-to-speech only works when the start command came
        from an Assist satellite; it's silently skipped for the
        fallback player.
      default: sound
      selector:
        select:
          mode: dropdown
          options:
            - value: sound
              label: Sound file
            - value: tts
              label: Text-to-speech
            - value: both
              label: Sound file + text-to-speech

    alarm_sound:
      name: Alarm sound media
      description: >-
        Used when Alert type is Sound file or Sound file +
        text-to-speech. e.g. media-source://media_source/local/alarm.mp3,
        or any URL your media players can play. The default assumes a
        file named alarm.mp3 directly in your Home Assistant `/media`
        folder — media-source://media_source/local/X means /media/X,
        not /media/local/X. Played via the originating Assist
        satellite's own announce feature (ducks/restores other audio
        automatically), falling back to the fallback media player's
        plain play_media (no ducking) when the command didn't come
        from a satellite.
      default: "media-source://media_source/local/alarm.mp3"
      selector:
        text:

    tts_message:
      name: Text-to-speech / notification message
      description: >-
        Also used as the phone notification's message text. As a
        repeating spoken alert, it's said on each repeat when Alert
        type is Text-to-speech or Sound file + text-to-speech, using
        the same Assist satellite's own configured voice/engine — that
        part only works when the start command came from a satellite
        (not the fallback player), and is skipped otherwise. Leave
        blank to use "<timer name> is done" instead.
      default: ""
      selector:
        text:

    repeat_interval:
      name: Repeat interval
      description: >-
        Target seconds between the start of each alert repeat. The
        actual sound/TTS playback time is measured and subtracted from
        the wait, so this is the total cycle length, not extra silence
        added on top of however long the alert takes to play.
      default: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: seconds

    notify_actions:
      name: Notify actions
      description: >-
        Optional. List of notify actions to call (e.g.
        notify.mobile_app_myphone) — check Developer Tools > Actions
        for the exact name for your device. Gets the full alert: Stop
        button, critical-alert sound, and tag-based clear/replace.
        Leave empty to skip.
      default: []
      selector:
        object:

    notify_entities:
      name: Notify entities
      description: >-
        Optional. Notify entities to push a plain notification to,
        picked from a list instead of typed. Only title + message —
        no Stop button, critical-alert sound, or tag-based
        clear/replace (use Notify actions above for those). Leave
        empty to skip.
      default: []
      selector:
        entity:
          domain: notify
          multiple: true

    show_progress:
      name: Show live countdown in notification (Notify actions only)
      description: >-
        Optional. Requires Notify actions above — Notify entities
        can't support this (its notify.send_message action rejects
        any extra data). Uses the companion app's Live Activity (iOS)
        / Live Update (Android) chronometer so the countdown ticks
        live on the lock screen/notification without repeated pushes.
        Bleeding-edge: needs iOS 17.2+ with the Labs feature enabled
        in TestFlight, or Android 16+ for the full status-bar chip,
        and HA Core 2026.7+ on both. Leave off (default) to keep only
        the existing finished-alert notification.
      default: false
      selector:
        boolean:

    done_sensors:
      name: Screen "Timers done" sensors
      description: >-
        Optional. Sensors that show a screen has this timer done, which
        tapping the screen's Stop clears; that silences the alert — at
        once between sounds, or when the sound already playing ends.
        Best is the Tessera Timers plugin's (0.4.0+) "Timers done"
        sensor, which lists the done timer helpers (e.g. `timer.eggs,
        timer.rice`), so each timer's Stop silences only its own alert.
        The older "Timer done" binary sensor also works, but is shared by
        every timer tile on the screen, so use it only on a screen with
        a single timer.
      default: []
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
          multiple: true

    silence_buttons:
      name: Screen "Silence timers" buttons
      description: >-
        Optional. Buttons pressed when the alert is silenced some other
        way than the screen's Stop (a stop phrase, the notification, the
        satellite's button), so the screen stops sounding too, e.g. the
        Tessera Timers plugin's (0.4.0+) "Silence timers" button. It
        silences every done timer on its screen, so if that screen's
        "Timers done" sensor is selected above, it's pressed only while
        this is the only timer helper done there.
      default: []
      selector:
        entity:
          domain: button
          multiple: true

    start_sentences:
      name: Start sentences
      description: |-
        Sentences that start the timer. Replace YOUR_TIMER_NAME with
        this timer's actual name in each instance you create.

        The article ("a"/"the") and duration clause are both
        optional, and duration accepts minutes or seconds — e.g.
        "start coffee timer", "start the coffee timer for 1 minute",
        "set a coffee timer for 30 seconds" all match, once edited.
      default:
        - "(start|set)[ (a|the)] YOUR_TIMER_NAME[ for ({0..180:minutes} (minute|minutes)|{0..180:seconds} (second|seconds))]"
      selector:
        object:

    stop_sentences:
      name: Stop sentences
      description: |-
        Sentences that cancel the timer while running, or silence the
        alert once it's gone off.

        {name} is a wildcard, checked at runtime against this timer
        helper's own name — so e.g. "stop coffee timer" only stops
        that instance, not other timers running at the same time. The
        timer's name must be said; there's no plain "stop the timer"
        fallback.
      default:
        - "stop {name}"
        - "cancel {name}"
      selector:
        object:

variables:
  timer_entity_id: !input timer_entity
  default_satellite_id: !input default_satellite
  fallback_player_id: !input fallback_media_player
  alarm_mode: !input alarm_mode
  repeat_interval: !input repeat_interval
  notify_actions: !input notify_actions
  notify_entities: !input notify_entities
  show_progress: !input show_progress
  done_sensor_ids: !input done_sensors
  done_binary_ids: "{{ done_sensor_ids | select('match', '^binary_sensor\\.') | list }}"
  done_list_ids: "{{ done_sensor_ids | select('match', '^sensor\\.') | list }}"
  silence_button_ids: !input silence_buttons
  timer_name: "{{ state_attr(timer_entity_id, 'friendly_name') or timer_entity_id }}"
  tts_message_input: !input tts_message
  alert_message: >-
    {% set msg = (tts_message_input | default('', true)) | trim %}
    {{ msg if msg else timer_name ~ ' is done' }}
  default_duration_seconds: >-
    {% set d = state_attr(timer_entity_id, 'duration') %}
    {% set parts = d.split(':') if d else ['0', '10', '0'] %}
    {{ parts[0] | int(0) * 3600 + parts[1] | int(10) * 60 + parts[2] | int(0) }}

triggers:
  - trigger: conversation
    command: !input start_sentences
    id: start
  - trigger: event
    id: continue
    event_type: voice_timer_alert_continue
    event_data:
      timer_entity_id: !input timer_entity
  # Started some other way (dashboard/screen tile, HA UI). A voice start
  # also flips the timer idle -> active, and the alert loop watches for
  # it as a snooze, so the condition below skips this trigger whenever
  # a run is already in progress.
  - trigger: state
    id: other_start
    entity_id: !input timer_entity
    from: idle
    to: active
  # Phone Stop button. A trigger here rather than in the alert loop's
  # wait: a one-off event that arrives while the loop is blocked on
  # assist_satellite.announce would otherwise be lost. mode: restart
  # ends the alert run; the branch below cleans up after it.
  - trigger: event
    id: phone_stop
    event_type: mobile_app_notification_action
    event_data:
      action: STOP_HA_TIMER_ALERT

conditions:
  - condition: template
    value_template: >-
      {{ trigger.id != 'other_start' or
         (this.attributes.current | default(0) | int(0)) == 0 }}
  # Only while the alert can be going, so a stale notification can't
  # end a running or paused countdown.
  - condition: template
    value_template: >-
      {{ trigger.id != 'phone_stop' or is_state(timer_entity_id, 'idle') }}

actions:
  - choose:
      # ================= Heard by voice: start + acknowledge, then hand off =================
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - variables:
              duration_seconds: >-
                {% if trigger.slots.seconds is defined %}
                  {{ trigger.slots.seconds | int }}
                {% elif trigger.slots.minutes is defined %}
                  {{ trigger.slots.minutes | int * 60 }}
                {% else %}
                  {{ default_duration_seconds }}
                {% endif %}
              duration_text: >-
                {% set total = duration_seconds | int %}
                {% set m = total // 60 %}
                {% set s = total % 60 %}
                {% if m > 0 and s > 0 -%}
                  {{ m }} minute{{ 's' if m != 1 else '' }}
                  {{ s }} second{{ 's' if s != 1 else '' }}
                {%- elif m > 0 -%}
                  {{ m }} minute{{ 's' if m != 1 else '' }}
                {%- else -%}
                  {{ s }} second{{ 's' if s != 1 else '' }}
                {%- endif %}
              start_target_satellite: >-
                {% set ents = device_entities(trigger.device_id)
                   if trigger.device_id is defined and trigger.device_id
                   else [] %}
                {% set sats = ents | select('match', '^assist_satellite\\.') | list %}
                {{ sats[0] if sats else '' }}

          - action: timer.start
            target:
              entity_id: "{{ timer_entity_id }}"
            data:
              duration: >-
                {% set total = duration_seconds | int %}
                {{ '%02d:%02d:%02d' % (total // 3600, (total % 3600) // 60, total % 60) }}

          # set_conversation_response only delivers once this automation's
          # run chain reaches a clean, uninterrupted completion — which
          # happens far too late here (only once the timer itself finishes
          # or is cancelled). Announce directly to the originating
          # satellite instead, the same reliable mechanism the finished
          # alert already uses.
          - set_conversation_response: "Starting {{ timer_name }} for {{ duration_text }}."
          - if:
              - condition: template
                value_template: "{{ start_target_satellite != '' }}"
            then:
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ start_target_satellite }}"
                data:
                  message: "Starting {{ timer_name }} for {{ duration_text }}."

          # Optional: begin a Live Activity/Live Update countdown notification.
          # Must happen before the event handoff below — once mode: restart
          # cancels this run, nothing after the event fire would execute.
          - if:
              - condition: template
                value_template: "{{ show_progress }}"
            then:
              - repeat:
                  for_each: "{{ notify_actions }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ timer_name }}"
                        message: "{{ duration_text }} remaining"
                        data:
                          tag: "ha_timer_alert"
                          live_update: true
                          chronometer: true
                          # Absolute Unix timestamp, not when_relative: true —
                          # the Android app has a history of dropping
                          # when_relative, and even when it works, a relative
                          # offset gets anchored to whenever the phone
                          # actually renders the notification (which Doze/App
                          # Standby can delay until the screen unlocks),
                          # desyncing the countdown from the real timer. An
                          # absolute timestamp is delivery-time independent.
                          when: "{{ (as_timestamp(now()) + duration_seconds) | int }}"
                          when_relative: false

          # Hand off to a decoupled run so this conversation turn — and any
          # media ducking tied to it — ends here instead of for the whole countdown.
          - event: voice_timer_alert_continue
            event_data:
              timer_entity_id: "{{ timer_entity_id }}"
              device_id: "{{ trigger.device_id | default('', true) }}"

      # ================= Started without voice: just hand off =================
      - conditions:
          - condition: trigger
            id: other_start
        sequence:
          - event: voice_timer_alert_continue
            event_data:
              timer_entity_id: "{{ timer_entity_id }}"
              device_id: ""

      # ================= Phone Stop: the restart ended the alert, clean up =================
      - conditions:
          - condition: trigger
            id: phone_stop
        sequence:
          - if:
              - condition: template
                value_template: "{{ fallback_player_id != '' }}"
            then:
              - action: media_player.media_stop
                target:
                  entity_id: "{{ fallback_player_id }}"
          - repeat:
              for_each: "{{ notify_actions }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "ha_timer_alert"

      # ================= Decoupled: wait for finish/cancel, then alert =================
      - conditions:
          - condition: trigger
            id: continue
        sequence:
          - variables:
              start_device_id: "{{ trigger.event.data.device_id }}"
              target_button: >-
                {% set ents = device_entities(start_device_id)
                   if start_device_id not in ['', 'unknown', 'unavailable', none]
                   else [] %}
                {% set buttons = ents | select('match', '^event\\..*_button_press$') | list %}
                {{ buttons[0] if buttons else '' }}
              target_satellite: >-
                {% set ents = device_entities(start_device_id)
                   if start_device_id not in ['', 'unknown', 'unavailable', none]
                   else [] %}
                {% set sats = ents | select('match', '^assist_satellite\\.') | list %}
                {{ sats[0] if sats else default_satellite_id }}

          # ---------- Wait inline for this timer to finish, or a cancel ----------
          # A named stop phrase that doesn't match this timer is ignored and
          # the wait resumes, so concurrent timers don't cancel each other.
          - repeat:
              until:
                - condition: template
                  value_template: >-
                    {% set name_slot = wait.trigger.slots.name
                       if wait.trigger is not none and wait.trigger.slots is defined
                          and 'name' in wait.trigger.slots
                       else none %}
                    {{ wait.trigger is not none and
                       (name_slot is none or
                        (name_slot | lower) in (timer_name | lower) or
                        (timer_name | lower) in (name_slot | lower)) }}
              sequence:
                - wait_for_trigger:
                    - trigger: event
                      id: finished
                      event_type: timer.finished
                      event_data:
                        entity_id: !input timer_entity
                    - trigger: event
                      id: cancel
                      event_type: timer.cancelled
                      event_data:
                        entity_id: !input timer_entity
                    - trigger: conversation
                      id: cancel
                      command: !input stop_sentences
                    - trigger: event
                      id: cancel
                      event_type: state_changed
                      event_data:
                        entity_id: "{{ target_button }}"

          - if:
              - condition: template
                value_template: "{{ wait.trigger is not none and wait.trigger.id == 'cancel' }}"
            then:
              - action: timer.cancel
                target:
                  entity_id: "{{ timer_entity_id }}"
              - set_conversation_response: "Cancelled {{ timer_name }}."
              - if:
                  - condition: template
                    value_template: "{{ target_satellite != '' }}"
                then:
                  - action: assist_satellite.announce
                    target:
                      entity_id: "{{ target_satellite }}"
                    data:
                      message: "Cancelled {{ timer_name }}."
              - if:
                  - condition: template
                    value_template: "{{ show_progress }}"
                then:
                  - repeat:
                      for_each: "{{ notify_actions }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            message: "clear_notification"
                            data:
                              tag: "ha_timer_alert"
              - stop: "Timer cancelled before it finished"

          - variables:
              target_player: >-
                {% set ents = device_entities(start_device_id)
                   if start_device_id not in ['', 'unknown', 'unavailable', none]
                   else [] %}
                {% set players = ents | select('match', '^media_player\\.') | list %}
                {{ players[0] if players else fallback_player_id }}

          - if:
              - condition: template
                value_template: "{{ show_progress }}"
            then:
              - repeat:
                  for_each: "{{ notify_actions }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "Timer finished"
                        message: "{{ alert_message }}"
                        data:
                          tag: "ha_timer_alert"
                          live_update: true
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 1.0
                          actions:
                            - action: STOP_HA_TIMER_ALERT
                              title: "Stop Timer"
            else:
              - repeat:
                  for_each: "{{ notify_actions }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "Timer finished"
                        message: "{{ alert_message }}"
                        data:
                          tag: "ha_timer_alert"
                          push:
                            sound:
                              name: default
                              critical: 1
                              volume: 1.0
                          actions:
                            - action: STOP_HA_TIMER_ALERT
                              title: "Stop Timer"

          - if:
              - condition: template
                value_template: "{{ notify_entities | count > 0 }}"
            then:
              - action: notify.send_message
                target:
                  entity_id: !input notify_entities
                data:
                  title: "Timer finished"
                  message: "{{ alert_message }}"

          # ---------- Loop the alert until a stop phrase / button / screen Stop ----------
          # As above, a named stop phrase for a different timer is ignored.
          # assist_satellite.announce blocks while the sound plays, and the
          # wait below only listens after it, so the screen's Stop (done
          # sensor turned off, or this timer gone from a "Timers done" list,
          # since the alert began) and a snooze (timer restarted) are also
          # checked as states, not just as triggers.
          #
          # A "Timers done" list only counts once it has named this timer,
          # so a list that changes for another timer before the screen
          # catches up isn't taken for a Stop: give the screen a moment.
          - if:
              - condition: template
                value_template: >-
                  {% set ns = namespace(found=false) %}
                  {% for e in done_list_ids
                     if timer_entity_id in states(e).split(', ') %}
                    {% set ns.found = true %}
                  {% endfor %}
                  {{ done_list_ids | count > 0 and not ns.found }}
            then:
              - wait_template: >-
                  {% set ns = namespace(found=false) %}
                  {% for e in done_list_ids
                     if timer_entity_id in states(e).split(', ') %}
                    {% set ns.found = true %}
                  {% endfor %}
                  {{ ns.found }}
                timeout:
                  seconds: 5
                continue_on_timeout: true
          - variables:
              alert_start: "{{ now().timestamp() }}"
              # The "Timers done" lists that name this timer
              alert_list_ids: >-
                {% set ns = namespace(ids=[]) %}
                {% for e in done_list_ids
                   if timer_entity_id in states(e).split(', ') %}
                  {% set ns.ids = ns.ids + [e] %}
                {% endfor %}
                {{ ns.ids }}
          - repeat:
              until:
                - condition: template
                  value_template: >-
                    {% set name_slot = wait.trigger.slots.name
                       if wait.trigger is not none and wait.trigger.slots is defined
                          and 'name' in wait.trigger.slots
                       else none %}
                    {% set ns = namespace(screen_stopped=false) %}
                    {% for e in done_binary_ids
                       if is_state(e, 'off') and
                          states[e].last_changed.timestamp() > alert_start | float %}
                      {% set ns.screen_stopped = true %}
                    {% endfor %}
                    {% for e in alert_list_ids
                       if has_value(e) and
                          timer_entity_id not in states(e).split(', ') %}
                      {% set ns.screen_stopped = true %}
                    {% endfor %}
                    {{ ns.screen_stopped or is_state(timer_entity_id, 'active') or
                       (wait.trigger is not none and
                        (name_slot is none or
                         (name_slot | lower) in (timer_name | lower) or
                         (timer_name | lower) in (name_slot | lower))) }}
              sequence:
                - variables:
                    loop_iteration_start: "{{ now().timestamp() }}"

                # TTS goes first: assist_satellite.announce blocks until it
                # finishes and can interrupt/override whatever the speaker
                # is currently playing, so a sound file played beforehand
                # would get cut off. Playing the sound second means nothing
                # comes after it to interrupt it.
                - if:
                    - condition: template
                      value_template: >-
                        {{ target_satellite != '' and alarm_mode in ['tts', 'both'] }}
                  then:
                    - action: assist_satellite.announce
                      target:
                        entity_id: "{{ target_satellite }}"
                      data:
                        message: "{{ alert_message }}"
                # Sound also goes through assist_satellite.announce when a
                # satellite is available — it ducks/restores other audio the
                # same way the TTS message does. media_player.play_media is
                # only used as a fallback when the command didn't come from
                # a satellite (no assist_satellite entity to announce
                # through), and doesn't duck/restore anything on its own.
                - if:
                    - condition: template
                      value_template: >-
                        {{ target_satellite != '' and alarm_mode in ['sound', 'both'] }}
                  then:
                    - action: assist_satellite.announce
                      target:
                        entity_id: "{{ target_satellite }}"
                      data:
                        media_id: !input alarm_sound
                - if:
                    - condition: template
                      value_template: >-
                        {{ target_satellite == '' and target_player != '' and alarm_mode in ['sound', 'both'] }}
                  then:
                    - action: media_player.play_media
                      target:
                        entity_id: "{{ target_player }}"
                      data:
                        media_content_id: !input alarm_sound
                        media_content_type: music
                # Skip the wait if the screen's Stop or a snooze already
                # happened during the sound; the until above then ends the loop.
                - if:
                    - condition: template
                      value_template: >-
                        {% set ns = namespace(screen_stopped=false) %}
                        {% for e in done_binary_ids
                           if is_state(e, 'off') and
                              states[e].last_changed.timestamp() > alert_start | float %}
                          {% set ns.screen_stopped = true %}
                        {% endfor %}
                        {% for e in alert_list_ids
                           if has_value(e) and
                              timer_entity_id not in states(e).split(', ') %}
                          {% set ns.screen_stopped = true %}
                        {% endfor %}
                        {{ not ns.screen_stopped and not is_state(timer_entity_id, 'active') }}
                  then:
                    - wait_for_trigger:
                        - trigger: conversation
                          command: !input stop_sentences
                        - trigger: event
                          event_type: state_changed
                          event_data:
                            entity_id: "{{ target_button }}"
                        - trigger: state
                          entity_id: !input done_sensors
                          from: "on"
                          to: "off"
                        # A state trigger on a "Timers done" list would also
                        # fire when another timer is added to or leaves it
                        - trigger: template
                          value_template: >-
                            {% set ns = namespace(screen_stopped=false) %}
                            {% for e in alert_list_ids
                               if has_value(e) and
                                  timer_entity_id not in states(e).split(', ') %}
                              {% set ns.screen_stopped = true %}
                            {% endfor %}
                            {{ ns.screen_stopped }}
                        - trigger: state
                          entity_id: !input timer_entity
                          to: active
                      timeout:
                        seconds: >-
                          {% set elapsed = now().timestamp() - (loop_iteration_start | float) %}
                          {{ [repeat_interval - elapsed, 1] | max }}
                      continue_on_timeout: true

          # Silenced some other way than the screen's Stop (a snooze
          # restarts the screen's tile itself): silence the screen too.
          # "Silence timers" stops every done timer on its screen, so skip
          # a screen whose "Timers done" list names another timer as well,
          # or no longer names this one.
          - variables:
              silence_ids: >-
                {% set ns = namespace(ids=[], screen_stopped=false) %}
                {% for e in done_binary_ids
                   if is_state(e, 'off') and
                      states[e].last_changed.timestamp() > alert_start | float %}
                  {% set ns.screen_stopped = true %}
                {% endfor %}
                {% for e in alert_list_ids
                   if has_value(e) and
                      timer_entity_id not in states(e).split(', ') %}
                  {% set ns.screen_stopped = true %}
                {% endfor %}
                {% if not ns.screen_stopped and
                      not is_state(timer_entity_id, 'active') %}
                  {% for b in silence_button_ids %}
                    {% set p = namespace(ok=true) %}
                    {% for e in done_list_ids
                       if device_id(b) is not none and
                          device_id(e) == device_id(b) and
                          states(e).split(', ') != [timer_entity_id] %}
                      {% set p.ok = false %}
                    {% endfor %}
                    {% if p.ok %}
                      {% set ns.ids = ns.ids + [b] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.ids }}
          - if:
              - condition: template
                value_template: "{{ silence_ids | count > 0 }}"
            then:
              - action: button.press
                target:
                  entity_id: "{{ silence_ids }}"

          - if:
              - condition: template
                value_template: "{{ target_player != '' }}"
            then:
              - action: media_player.media_stop
                target:
                  entity_id: "{{ target_player }}"

          - repeat:
              for_each: "{{ notify_actions }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "ha_timer_alert"

          # Timer restarted mid-alert (snooze): follow the new countdown on
          # the same device. Must be last — mode: restart ends this run.
          - if:
              - condition: template
                value_template: "{{ is_state(timer_entity_id, 'active') }}"
            then:
              - event: voice_timer_alert_continue
                event_data:
                  timer_entity_id: "{{ timer_entity_id }}"
                  device_id: "{{ start_device_id }}"

mode: restart
